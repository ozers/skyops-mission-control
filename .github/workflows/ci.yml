name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skyops
          POSTGRES_PASSWORD: skyops
          POSTGRES_DB: skyops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyops -d skyops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: skyops
      DB_PASSWORD: skyops
      DB_NAME: skyops
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r build

      - run: pnpm -r test

      - run: pnpm --filter api migration:run

      - run: pnpm --filter api test:integration

      - run: pnpm --filter api test:e2e

      - run: pnpm --filter web exec playwright install --with-deps chromium

      # Playwright starts the web dev server itself; the API has to be up first.
      - name: Run the web end-to-end flow
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health > /dev/null && break
            sleep 1
          done
          pnpm --filter web test:e2e
